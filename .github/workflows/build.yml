name: Build Analog API EQ

# Se ejecuta automáticamente cada vez que subes/actualizas código,
# y también se puede lanzar manualmente desde la pestaña "Actions" en GitHub.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar el proyecto con CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Subir el VST3/Standalone compilado
        uses: actions/upload-artifact@v4
        with:
          name: AnalogAPI_EQ-Windows
          path: |
            build/AnalogAPI_EQ_artefacts/Release/VST3/**
            build/AnalogAPI_EQ_artefacts/Release/Standalone/**

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar el proyecto con CMake
        run: cmake -B build -G Xcode

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Subir el VST3/AU/Standalone compilado
        uses: actions/upload-artifact@v4
        with:
          name: AnalogAPI_EQ-macOS
          path: |
            build/AnalogAPI_EQ_artefacts/Release/VST3/**
            build/AnalogAPI_EQ_artefacts/Release/AU/**
            build/AnalogAPI_EQ_artefacts/Release/Standalone/**
